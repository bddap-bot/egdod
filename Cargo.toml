[package]
name = "egdod"
version = "0.1.0"
edition = "2021"
description = "First process to wake on a machine with no OS: dial out, hand the controller exec/copy/forward over one connection."
license = "MIT OR Apache-2.0"

# Standalone package: the empty table stops cargo from walking up and letting an
# unrelated parent workspace claim it.
[workspace]

[dependencies]
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "fs", "sync", "net"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
