[package]
name = "egdod"
version = "0.1.0"
edition = "2021"
description = "Dial-out root access to a bare machine over iroh: exec, copy, forward."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bddap-bot/egdod"

# Standalone package: the empty table stops cargo walking up into an unrelated
# parent workspace if this repo is checked out inside one. `vendor` is excluded
# so the patched crate stays a plain path dependency — its dev-deps (criterion)
# never enter our lockfile.
[workspace]
exclude = ["vendor"]

# egdod#3: upstream noq-udp asserts align_of::<payload> <= align_of::<cmsghdr>
# and does aligned cmsg reads; musl declares cmsghdr with align 4 (glibc: 8),
# so the static agent aborted on its first received datagram. The vendored
# copy is crates.io 1.1.0 with unaligned cmsg reads/writes — see
# vendor/noq-udp/VENDOR.md. Drop the whole vendor dir once upstream ships the fix.
[patch.crates-io]
noq-udp = { path = "vendor/noq-udp" }

[dependencies]
iroh = "1"
# Only for StreamExt over iroh's path-event stream; already in the tree via iroh.
futures-lite = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "fs", "sync", "net", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
