[package]
name = "egdod"
version = "0.1.0"
edition = "2021"
description = "Dial-out root access to a bare machine over iroh: exec, copy, forward."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bddap-bot/egdod"

# Standalone package: the empty table stops cargo walking up into an unrelated
# parent workspace if this repo is checked out inside one.
[workspace]

[dependencies]
iroh = "1"
# Only for StreamExt over iroh's path-event stream; already in the tree via iroh.
futures-lite = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "fs", "sync", "net", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
